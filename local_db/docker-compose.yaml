# docker-compose.yml
services:
  db:
    image: mysql:8.0 # Using MySQL 8.0, a recent stable version
    container_name: job_tracker_mysql # A friendly name for your container
    environment:
      # These variables will be loaded from your .env file
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306" # Maps container's 3306 to your host's 3306
    volumes:
      - mysql_data:/var/lib/mysql # Persistent storage for your database data
      # Mounts your init.sql to be executed on container startup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped # Always restart the container if it stops unexpectedly
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 10s
      retries: 5

  python:
    build: .
    container_name: job_tracker_data_populator
    working_dir: /app
    environment:
      MYSQL_HOST: db # The service name 'db' is the hostname for the MySQL container
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - | 
        pip install --no-cache-dir -r requirements.txt &&
        python data_creation.py


volumes:
  mysql_data: # Define the named volume for data persistence